<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <title>nube de Benjamín</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>

  <div class="bg">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div id="stars"></div>
    <div class="celestial">
      <div class="moon"></div>
      <div class="planet planet--1"></div>
      <div class="planet planet--2"></div>
      <div class="planet planet--3"></div>
      <div class="planet planet--4"></div>
    </div>
  </div>
  <div class="vignette"></div>

  <div class="header-tag">
    <svg class="header-tag__icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4" fill="url(#hg)"/><defs><radialGradient id="hg" cx="40%" cy="40%"><stop offset="0%" stop-color="#7ee8fa"/><stop offset="100%" stop-color="#c471ed"/></radialGradient></defs></svg>
    <span>nube de Benjamín</span>
  </div>

  <canvas id="wordCloud"></canvas>

  <div class="info-panel" id="info-panel">
    <div class="info-panel__word" id="infoWord"></div>
    <div class="info-panel__desc" id="infoDesc"></div>
    <div class="info-panel__actions">
      <button class="info-panel__btn info-panel__btn--edit" id="infoEdit" type="button">editar</button>
    </div>
  </div>

  <div class="hint" id="hint">pasa el mouse sobre una palabra · clic selecciona · doble clic edita</div>

  <button class="density-chip" id="densityChip" type="button">ver todas</button>

  <div class="hotspot" id="hotspot" title="nueva palabra">+</div>

  <div class="form-mask" id="formMask">
    <div class="form" id="form">
      <button class="form__close" id="formClose" type="button" aria-label="cerrar">&times;</button>
      <h2 class="form__title" id="formTitle">nueva palabra</h2>
      <input type="text" id="wordInput" class="form__input" placeholder="escribe la palabra…" maxlength="28" autocomplete="off">
      <div class="form__row">
        <span class="form__label">nivel</span>
        <div class="level-dots" id="levelDots"></div>
        <button class="btn-dice" id="diceBtn" type="button" title="nivel aleatorio">&#127922;</button>
        <label class="auto-random"><input type="checkbox" id="autoRandom"> auto</label>
        <span class="level-num" id="levelNum"></span>
      </div>
      <textarea id="descInput" class="form__desc" rows="2" placeholder="descripción (opcional)…"></textarea>
      <div class="form__actions">
        <button class="form__add" id="addBtn" type="button">agregar a la nube</button>
        <button class="form__delete" id="formDelete" type="button">borrar</button>
      </div>
      <div class="form__hint">enter para agregar · esc para salir</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="pin-mask" id="pinMask">
    <div class="pin-modal">
      <div class="pin-modal__title">ingresá el PIN</div>
      <input type="password" id="pinInput" class="pin-modal__input" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="······">
      <div class="pin-modal__error" id="pinError">PIN incorrecto</div>
      <div class="pin-modal__actions">
        <button class="pin-modal__btn pin-modal__btn--cancel" id="pinCancel" type="button">cancelar</button>
        <button class="pin-modal__btn pin-modal__btn--ok" id="pinOk" type="button">ok</button>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
